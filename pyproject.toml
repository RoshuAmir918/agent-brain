[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-brain"
version = "0.12.9"
description = "Configurable Markdown memory mechanics for a personal Hermes agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.urls]
Homepage = "https://github.com/RoshuAmir918/agent-brain"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
brain = "brain.nightly:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain = ["skills/*/SKILL.md", "templates/*.md", "scripts/*.sh", "migrations/*.md", "hermes_plugin/plugin.yaml", "hermes_plugin/README.md"]
