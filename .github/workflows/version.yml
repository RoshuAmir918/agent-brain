name: version
# Every change to main ships as its own version: migrations, the changelog and `brain update` all key on the number,
# and two PRs on one number hide each other (0.48.0 and 0.48.1 each shipped twice on 2026-11-06, and the second
# 0.48.1's migration was never run). A PR's version must be higher than main's when it merges.
# It reports on every PR, so it can be a required check: a PR that changes no engine code passes at once. Required with
# "branches up to date", a PR merges only once it has the latest main, so it is compared with the version actually there.
# A patch bump is the default. The minor goes up only with a migration file, or with the `minor` label for a vault,
# config or state format change that needs none, so a minor number always means vaults changed (README, Versions).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The version is higher than main's
        run: |
          git fetch -q origin main
          if ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|pyproject\.toml$)'; then
            echo "no engine code changed; no new version needed"
            exit 0
          fi
          ours=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          theirs=$(git show origin/main:pyproject.toml | grep -m1 '^version = ' | cut -d'"' -f2)
          echo "this PR: $ours, main: $theirs"
          if [ "$ours" = "$theirs" ] || [ "$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -1)" != "$ours" ]; then
            echo "::error::version $ours is not higher than main's $theirs; bump pyproject.toml (and name any migration file for the new version)"
            exit 1
          fi
          for m in src/brain/migrations/*.md; do
            v=$(basename "$m" .md)
            [ "$v" = README ] && continue
            if [ "$(printf '%s\n%s\n' "$v" "$ours" | sort -V | tail -1)" != "$ours" ]; then
              echo "::error::migration $m is for $v, beyond this PR's version $ours"
              exit 1
            fi
          done
      - name: A patch bump unless vaults change
        env:
          MINOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
        run: |
          if ! git diff --name-only origin/main...HEAD | grep -qE '^(src/|pyproject\.toml$)'; then exit 0; fi
          ours=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          theirs=$(git show origin/main:pyproject.toml | grep -m1 '^version = ' | cut -d'"' -f2)
          migration=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'src/brain/migrations/*.md' | grep -v README || true)
          if [ "${ours%.*}" = "${theirs%.*}" ]; then
            if [ -n "$migration" ]; then
              echo "::error::this PR ships $migration, so it takes the next minor version, not a patch"
              exit 1
            fi
          elif [ "${ours##*.}" != 0 ]; then
            echo "::error::a minor bump starts at patch 0: $ours"
            exit 1
          elif [ -z "$migration" ] && [ "$MINOR_LABEL" != true ]; then
            echo "::error::$ours is a minor bump with no migration file; bump the patch instead, or add the 'minor' label if a vault, config or state format changed"
            exit 1
          fi
